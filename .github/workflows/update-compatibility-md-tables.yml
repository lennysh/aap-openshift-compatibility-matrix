# .github/workflows/update-compatibility-md-tables.yml
#
# Regenerates AAP_*.md when a data/AAP_*.csv is changed by hand and pushed to main.
# (The scheduled "Update AAP CSV matrix" workflow regenerates markdown itself; its
# GITHUB_TOKEN pushes do not trigger this workflow.)

name: Update Compatibility Markdown Tables from CSV

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'data/AAP_*.csv'
      - 'scripts/csv2md.sh'
      - 'scripts/generate-md-tables.sh'

# Needed so the job can push the regenerated markdown back to main
permissions:
  contents: write

# Shared with update-csv-matrix.yml so the two never push to main at the same time
concurrency:
  group: push-to-main
  cancel-in-progress: false

jobs:
  update-tables:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Generate Markdown tables from CSV
        run: ./scripts/generate-md-tables.sh

      - name: Commit and push changes
        run: |
          set -euo pipefail
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions[bot]"

          git add AAP_*.md README.md
          if git diff --staged --quiet; then
            echo "No changes to the Markdown files. Nothing to commit."
            exit 0
          fi

          git commit -m "docs: auto-generate markdown tables from CSV update"
          git pull --rebase origin main
          git push origin HEAD:main
