# Update AAP operator CSV compatibility matrix from Red Hat operator index,
# regenerate the markdown tables and OCP index coverage report, and push
# everything back to main in one commit.
#
# Checks hourly, but the full operator-index scrape only runs when:
#   - the Red Hat catalog API's AAP bundle listing changed since the last full run, or
#   - no full run has succeeded yet today (UTC); the API doesn't show every coverage
#     change, so this is the daily catch-all, or
#   - the run was started by hand, or by a push that changed the playbook or this workflow.
# "Already processed" is an Actions cache entry keyed by UTC date + catalog fingerprint,
# saved only once a full run has pushed (or had nothing to push). A run that fails, is
# skipped, or is cancelled while queued is therefore simply retried the next hour.
#
# Required repo secrets: REGISTRY_USERNAME, REGISTRY_PASSWORD (Red Hat registry credentials)

name: Update AAP CSV matrix

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'ansible/**'
      - 'scripts/catalog-fingerprint.py'
      - '.github/workflows/update-csv-matrix.yml'
  schedule:
    # Hourly, at an off-peak minute (scheduled runs at the top of the hour are the most
    # likely to be delayed or dropped). Most runs stop after the catalog check.
    - cron: '37 * * * *'

permissions:
  contents: write

# Shared with update-compatibility-md-tables.yml so the two never push to main at the same time
concurrency:
  group: push-to-main
  cancel-in-progress: false

jobs:
  update-csv:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Optional: when set, start the component-version fill workflow (another repo) as soon
      # as this run pushes CSV changes, instead of waiting for its own (often hours-late)
      # schedule. VERSION_FILL_TOKEN: fine-grained token with Actions read/write on that repo
      # only. VERSION_FILL_REPO (repository variable): owner/name of that repo.
      HAS_VERSION_FILL: ${{ secrets.VERSION_FILL_TOKEN != '' && vars.VERSION_FILL_REPO != '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Fingerprint the Red Hat catalog
        id: catalog
        run: |
          if out=$(python3 scripts/catalog-fingerprint.py); then
            fp="${out#fingerprint=}"
            echo "key=catalog-$(date -u +%F)-${fp:0:16}" >> "$GITHUB_OUTPUT"
            echo "Catalog fingerprint: ${fp:0:16}"
          else
            echo "::warning::Red Hat catalog API unavailable"
          fi

      - name: Check whether this catalog state was already processed today
        id: seen
        if: steps.catalog.outputs.key != ''
        uses: actions/cache/restore@v6
        with:
          path: .catalog-processed
          key: ${{ steps.catalog.outputs.key }}
          lookup-only: true

      - name: Decide whether to run the full scrape
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          KEY: ${{ steps.catalog.outputs.key }}
          SEEN: ${{ steps.seen.outputs.cache-hit }}
        run: |
          if [ "$EVENT" != "schedule" ]; then
            run=true;  why="started by $EVENT"
          elif [ -z "$KEY" ]; then
            run=false; why="catalog API unavailable; will retry next hour"
          elif [ "$SEEN" = "true" ]; then
            run=false; why="catalog unchanged since today's last full run"
          else
            run=true;  why="catalog changed, or first full run today"
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "Full scrape: $run ($why)"

      - name: Install Podman
        if: steps.decide.outputs.run == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Set up Python
        if: steps.decide.outputs.run == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Ansible
        if: steps.decide.outputs.run == 'true'
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "ansible-core>=2.20,<2.23"

      # Use Red Hat action so login works with rootless podman on runners; avoids password in playbook logs
      - name: Log in to Red Hat container registry
        if: steps.decide.outputs.run == 'true'
        uses: redhat-actions/podman-login@v2
        with:
          registry: registry.redhat.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Run Ansible playbook
        if: steps.decide.outputs.run == 'true'
        working-directory: ansible
        run: ansible-playbook playbook.yml -i inventory.yml -e "ansible_python_interpreter=$(command -v python)"

      # Always regenerate so markdown also self-heals if it ever drifted from the CSVs
      - name: Generate Markdown tables from CSV
        if: steps.decide.outputs.run == 'true'
        run: ./scripts/generate-md-tables.sh

      - name: Generate OCP index coverage report
        if: steps.decide.outputs.run == 'true'
        run: python scripts/csv-overlaps-to-markdown.py scripts/csv-overlaps.json -o OCP_INDEX_COVERAGE.md

      - name: Commit and push changes
        id: commit
        if: steps.decide.outputs.run == 'true'
        run: |
          set -euo pipefail
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions[bot]"

          git add data/*.csv AAP_*.md OCP_INDEX_COVERAGE.md README.md
          git diff --staged --quiet -- data/ || echo "data_changed=true" >> "$GITHUB_OUTPUT"
          if git diff --staged --quiet; then
            echo "No CSV or markdown changes. Nothing to commit."
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "chore: update AAP CSV matrix and markdown tables"
          # Other workflows also push data/*.csv changes, sometimes to the same rows. If
          # main moved underneath this run, rebase; on a real conflict don't fail the run,
          # just leave this catalog state unrecorded so the next hourly run redoes it.
          for attempt in 1 2 3; do
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              echo "::warning::Conflicting change on main; not pushed, will retry next hour"
              echo "pushed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if git push origin HEAD:main; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "::warning::Push failed 3 times; will retry next hour"
          echo "pushed=false" >> "$GITHUB_OUTPUT"

      - name: Record this catalog state as processed
        if: >-
          steps.decide.outputs.run == 'true' && steps.commit.outputs.pushed == 'true'
          && steps.catalog.outputs.key != '' && steps.seen.outputs.cache-hit != 'true'
        run: date -u > .catalog-processed

      - name: Save processed marker
        if: >-
          steps.decide.outputs.run == 'true' && steps.commit.outputs.pushed == 'true'
          && steps.catalog.outputs.key != '' && steps.seen.outputs.cache-hit != 'true'
        # A concurrent run may have saved the same key already; that's fine
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: .catalog-processed
          key: ${{ steps.catalog.outputs.key }}

      - name: Start the component-version fill
        if: >-
          env.HAS_VERSION_FILL == 'true' && steps.commit.outputs.pushed == 'true'
          && steps.commit.outputs.data_changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.VERSION_FILL_TOKEN }}
          FILL_REPO: ${{ vars.VERSION_FILL_REPO }}
        run: gh workflow run "AAP Workflow" --repo "$FILL_REPO"
