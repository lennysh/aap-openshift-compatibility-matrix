---
- name: Check if podman is installed
  ansible.builtin.command: which podman
  register: aap_matrix_podman_check
  changed_when: false
  failed_when: aap_matrix_podman_check.rc != 0

- name: Log in to Red Hat container registry
  when: aap_matrix_registry_username | length > 0 and aap_matrix_registry_password | length > 0
  ansible.builtin.shell: |
    set -o pipefail
    echo "{{ aap_matrix_registry_password }}" | podman login {{ aap_matrix_registry }} -u "{{ aap_matrix_registry_username }}" --password-stdin
  no_log: true
  changed_when: false

- name: Verify registry login (when credentials not provided)
  when: >-
    aap_matrix_registry_username | default('') | length == 0
    or aap_matrix_registry_password | default('') | length == 0
  ansible.builtin.command:
    cmd: podman login {{ aap_matrix_registry }} --get-login
  register: aap_matrix_login_check
  changed_when: false
  failed_when: aap_matrix_login_check.rc != 0

- name: Clear operator index cache from previous runs (it is only shared within one run)
  ansible.builtin.file:
    path: "{{ aap_matrix_index_cache_dir }}"
    state: absent

- name: Discover OCP versions and AAP channels from the Red Hat catalog
  when: >-
    aap_matrix_operator_index_ocp_versions | length == 0
    or aap_matrix_aap_streams | length == 0
  aap_matrix_discover:
    package_name: "{{ aap_matrix_operator_package }}"
    catalog_api_url: "{{ aap_matrix_catalog_api_url }}"
    min_ocp_version: "{{ aap_matrix_min_ocp_version }}"
    min_aap_version: "{{ aap_matrix_min_aap_version }}"
    max_ocp_candidates: "{{ aap_matrix_max_ocp_candidates }}"
  register: aap_matrix_discovery

- name: Use discovered OCP versions and AAP streams (manual overrides win)
  when: aap_matrix_discovery is not skipped
  ansible.builtin.set_fact:
    aap_matrix_operator_index_ocp_versions: >-
      {{ aap_matrix_operator_index_ocp_versions
         if aap_matrix_operator_index_ocp_versions | length > 0
         else aap_matrix_discovery.ocp_versions }}
    aap_matrix_aap_streams: >-
      {{ aap_matrix_aap_streams
         if aap_matrix_aap_streams | length > 0
         else aap_matrix_discovery.aap_streams }}

- name: Show OCP versions and AAP streams for this run
  ansible.builtin.debug:
    msg:
      - "OCP index tags: {{ aap_matrix_operator_index_ocp_versions | join(', ') }}"
      - >-
        AAP streams: {{ aap_matrix_aap_streams
          | map(attribute='aap_version') | join(', ') }}

# Pull every index tag up front, several at a time, into the run cache. aap_csv_update and the
# OpenShift Support scrape then read them from the cache instead of pulling one by one. Any tag
# that fails here is simply pulled by those tasks as before.
- name: Prefetch operator indexes in parallel
  when: aap_matrix_prefetch_workers | int > 0
  aap_operator_index_prefetch:
    ocp_versions: "{{ aap_matrix_operator_index_ocp_versions }}"
    package_name: "{{ aap_matrix_operator_package }}"
    registry: "{{ aap_matrix_registry }}"
    index_cache_dir: "{{ aap_matrix_index_cache_dir }}"
    workers: "{{ aap_matrix_prefetch_workers }}"
  register: aap_matrix_prefetch

- name: Show prefetch results
  when: aap_matrix_prefetch is not skipped
  ansible.builtin.debug:
    msg: "{{ [aap_matrix_prefetch.msg] + (aap_matrix_prefetch.results | map(attribute='line') | list) }}"
