---
# Registry (override with -e or REGISTRY_USERNAME / REGISTRY_PASSWORD env vars)
aap_matrix_registry: registry.redhat.io
aap_matrix_registry_username: "{{ lookup('env', 'REGISTRY_USERNAME') }}"
aap_matrix_registry_password: "{{ lookup('env', 'REGISTRY_PASSWORD') }}"

# Repo paths (role lives under ansible/roles/<role>/)
aap_matrix_repo_root: "{{ playbook_dir }}/.."
aap_matrix_data_dir: "{{ aap_matrix_repo_root }}/data"
aap_matrix_overlaps_json: "{{ aap_matrix_repo_root }}/scripts/csv-overlaps.json"
# Operator index extracts (one dir per OCP) shared between aap_csv_update and the
# OpenShift Support scrape within one run; cleared at the start of every run
aap_matrix_index_cache_dir: "{{ aap_matrix_repo_root }}/.cache/operator-index"

# Operator package to track
aap_matrix_operator_package: ansible-automation-platform-operator

# --- Discovery -------------------------------------------------------------------
# OCP versions and AAP channels are discovered on every run from the public Red Hat
# catalog API (no credentials), so new OCP releases and new AAP stable-X.Y channels are
# picked up automatically. The operator index images are still the source of truth for
# the data itself.
aap_matrix_catalog_api_url: https://catalog.redhat.com/api/containers/v1/operators/bundles
# Ignore anything older than these
aap_matrix_min_ocp_version: "4.11"
aap_matrix_min_aap_version: "2.4"
# Per AAP stream, try this many of the newest OCP index tags carrying it (newest first;
# falls back if a tag is listed in the catalog but its index isn't published yet)
aap_matrix_max_ocp_candidates: 3
# Pull this many operator indexes at once before the per-stream / per-OCP loops, which then
# read them from the run cache. 0 disables prefetching. Each in-flight index needs a few GB of
# container storage until it is extracted and removed.
aap_matrix_prefetch_workers: 3
# Create data/AAP_<ver>.csv (header copied from the newest existing CSV) when a new
# AAP stream appears
aap_matrix_create_missing_csv: true

# Optional manual overrides. Leave empty to use discovery.
#   aap_matrix_operator_index_ocp_versions: ["4.18", "4.19"]
#   aap_matrix_aap_streams:
#     - aap_version: "2.7"
#       namespace_channel: stable-2.7
#       cluster_channel: stable-2.7-cluster-scoped
#       ocp_versions: ["4.20", "4.18"]   # tried in order
aap_matrix_operator_index_ocp_versions: []
aap_matrix_aap_streams: []

# AAP CSV version update: column indices (1-based)
aap_matrix_columns:
  release_date: 1
  cluster_scoped: 2
  namespace_scoped: 3
  openshift_support: 4
